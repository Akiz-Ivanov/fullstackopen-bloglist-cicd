events {}

http {
  server {
    listen 80;

    location / {
      proxy_pass http://frontend:5173;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    location /api/ {
      #* No path after host:port here — this passes the full incoming
      #* URI through unchanged, so /api/blogs stays /api/blogs when it
      #* reaches the backend.
      proxy_pass http://backend:3003;
    }
  }
}